version: '3.8'

networks:
  private-vpc-net:
    driver: bridge

services:
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: enterprise-vector-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - private-vpc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  orchestrator-app:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: enterprise-orchestrator-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres-vector
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      postgres-vector:
        condition: service_healthy
    networks:
      - private-vpc-net
    restart: on-failure

volumes:
  pgvector_data: