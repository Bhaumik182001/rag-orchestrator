version: '3.8'

networks:
  private-vpc-net:
    driver: bridge

services:
  # 1. Isolated Vector Database
  postgres-vector:
    image: pgvector/pgvector:pg16
    container_name: enterprise-vector-db
    environment:
      - POSTGRES_USER=raguser
      - POSTGRES_PASSWORD=ragpass
      - POSTGRES_DB=rag_db
    ports:
      - "5433:5432" # Exposed only for your pgAdmin debugging
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - private-vpc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Spring Boot Orchestrator Microservice
  orchestrator-app:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    container_name: enterprise-orchestrator-app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres-vector
      - DB_PORT=5432
      - DB_NAME=rag_db
      - DB_USER=raguser
      - DB_PASSWORD=ragpass
      # Points to Ollama running on your Windows host machine with GPU acceleration
      - OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      postgres-vector:
        condition: service_healthy
    networks:
      - private-vpc-net
    restart: on-failure

volumes:
  pgvector_data:
